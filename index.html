<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Swift 星際學習之旅</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000;font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif}
body{color:#ffd92f;perspective:500px}

/* 星空 */
#stars,#stars2{position:fixed;inset:0;pointer-events:none}
.star{position:absolute;background:#fff;border-radius:50%;animation:twinkle 2.5s infinite ease-in-out}
@keyframes twinkle{0%,100%{opacity:.2}50%{opacity:1}}

/* 開場畫面 */
.intro{
 position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
 background:radial-gradient(ellipse at center,#10152b 0%,#03040b 55%,#000 100%);
 overflow:hidden;
}
.vignette{position:absolute;inset:0;box-shadow:inset 0 0 130px 45px #000;pointer-events:none}

/* 中央標題 */
.center-title{
 position:absolute;z-index:5;text-align:center;color:#ffe500;
 animation:titleFade 4s ease forwards;
 text-shadow:0 0 12px rgba(255,220,40,.4);
}
.center-title .swift{font-size:clamp(48px,12vw,110px);font-weight:900;letter-spacing:.12em}
.center-title .sub{font-size:clamp(16px,3vw,28px);letter-spacing:.35em;margin-top:8px}
@keyframes titleFade{
 0%,55%{opacity:1;transform:scale(1)}
 100%{opacity:0;transform:scale(1.15)}
}

/* 星戰風文字 */
.crawl-wrap{
 position:absolute;inset:0;display:flex;justify-content:center;
 overflow:hidden;z-index:3;
 perspective:450px;
}
.crawl{
 width:min(760px,88vw);
 position:absolute;top:105%;
 text-align:center;
 transform-origin:50% 100%;
 transform:rotateX(25deg);
 animation:crawl 34s linear 4s forwards;
 color:#ffe51c;
 font-weight:700;
 line-height:1.65;
 text-shadow:0 0 5px rgba(255,225,20,.25);
}
.crawl h1{font-size:clamp(26px,5vw,52px);letter-spacing:.12em;margin:0 0 34px}
.crawl h2{font-size:clamp(19px,3vw,30px);margin:38px 0 16px;letter-spacing:.08em}
.crawl p{font-size:clamp(17px,2.5vw,25px);margin:0 auto 24px;letter-spacing:.04em}
@keyframes crawl{
 0%{top:105%;transform:rotateX(25deg) translateZ(0)}
 100%{top:-180%;transform:rotateX(25deg) translateZ(-300px)}
}

/* 按鈕 */
.start{
 position:absolute;z-index:10;bottom:9%;left:50%;transform:translateX(-50%);
 opacity:0;animation:buttonIn 1.5s ease 34s forwards;
 border:2px solid #ffe51c;color:#ffe51c;background:rgba(0,0,0,.55);
 padding:14px 32px;border-radius:6px;font-size:18px;letter-spacing:.15em;
 cursor:pointer;transition:.25s;backdrop-filter:blur(4px)
}
.start:hover{background:#ffe51c;color:#000;box-shadow:0 0 30px rgba(255,220,30,.5)}
@keyframes buttonIn{to{opacity:1}}

.skip{
 position:absolute;right:20px;bottom:20px;z-index:11;
 color:#aaa;background:rgba(0,0,0,.5);border:1px solid #555;
 padding:8px 14px;border-radius:5px;cursor:pointer;font-size:13px
}
.skip:hover{color:#fff;border-color:#aaa}

@media(max-width:600px){
 .crawl{width:92vw;line-height:1.8}
 .crawl p{font-size:16px}
 .crawl h1{font-size:27px}
}
</style>
</head>

<body>
<div id="stars"></div>
<div id="stars2"></div>

<main class="intro" id="intro">
  <div class="center-title">
    <div class="swift">SWIFT</div>
    <div class="sub">iOS APP DEVELOPMENT</div>
  </div>

  <div class="crawl-wrap">
    <section class="crawl" id="crawl">
      <h1>第一章：程式設計的旅程</h1>

      <p>很久很久以前……</p>

      <p>在一個充滿創意與科技的世界裡，<br>
      一群學習者準備踏上一段新的旅程。</p>

      <p>這一次，他們的任務是——</p>

      <h2>學習 SWIFT</h2>

      <p>從第一行程式碼開始，<br>
      認識變數、條件判斷、迴圈與函式，<br>
      一步一步建立屬於自己的程式世界。</p>

      <p>接著，他們將學習使用<br>
      <strong>SwiftUI</strong> 建立畫面，</p>

      <p>讓文字、圖片、按鈕與動畫<br>
      成為真正可以操作的 App。</p>

      <h2>最終任務</h2>

      <p>親手開發一個屬於自己的<br>
      <strong>iOS App</strong>。</p>

      <p>旅程即將開始。</p>

      <p>現在，拿起你的鍵盤，<br>
      開啟 Xcode。</p>

      <h1>讓我們開始創造。</h1>
    </section>
  </div>

  <button class="start" onclick="startLearning()">開始學習 Swift</button>
  <button class="skip" onclick="skipIntro()">跳過開場</button>
  <div class="vignette"></div>
</main>

<script>
// 產生星空
const stars = document.getElementById("stars");
const stars2 = document.getElementById("stars2");

for(let i=0;i<170;i++){
  const s=document.createElement("span");
  s.className="star";
  const size=Math.random()*2.4+.5;
  s.style.width=size+"px";
  s.style.height=size+"px";
  s.style.left=Math.random()*100+"%";
  s.style.top=Math.random()*100+"%";
  s.style.animationDelay=(Math.random()*3)+"s";
  stars.appendChild(s);
}
for(let i=0;i<70;i++){
  const s=document.createElement("span");
  s.className="star";
  const size=Math.random()*1.5+.4;
  s.style.width=size+"px";
  s.style.height=size+"px";
  s.style.left=Math.random()*100+"%";
  s.style.top=Math.random()*100+"%";
  s.style.opacity=.5;
  s.style.animationDelay=(Math.random()*4)+"s";
  stars2.appendChild(s);
}

function skipIntro(){
  document.getElementById("crawl").style.animation="none";
  document.getElementById("crawl").style.top="-180%";
  document.querySelector(".center-title").style.display="none";
  document.querySelector(".start").style.animation="buttonIn .8s forwards";
}

function startLearning(){
  alert("🚀 歡迎來到 Swift 學習之旅！\n\n下一站：認識 Swift 與第一行程式碼。");
}
</script>
</body>
</html>
